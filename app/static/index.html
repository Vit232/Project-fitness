<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1012">
  <title>RepLog</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c6f432'/%3E%3Cpath d='M9 11v10M23 11v10M6 14v4M26 14v4M9 16h14' stroke='%2314171a' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // apply the saved theme before first paint
    try {
      var t = localStorage.getItem('replog.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="app"><div class="splash"><div class="spinner"></div></div></div>
  <noscript>RepLog needs JavaScript to run.</noscript>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
